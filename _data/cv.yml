- title: Projects & Research
  type: nested_list
  contents:
    - title: Master's Thesis – Robotic Welding Automation (Completed in 9 months)
      items:
        - Tailored solution to local manufacturers needs.
        - Designed an automated welding system using a 6-DOF UR10e robotic arm.
        - Integrated a Miller MIG welding tool, power supply and wire feeder with a ROS based control system and planner.
        - Developed a custom Traveling Salesman Problem (TSP) solver using a Mixed Integer Program (MIP) to optimize weld/tack order. Scaled cost of paths based on scaled weight for joint movement cost.
        - Segmented initial configuration into kinematic families to produce trajectories in a consistent joint subspace.
        - Implemented human-robot collaboration algorithms and procedures for part localization and adaptive trajectory execution.
        - Generated smooth joint trajectories based on pre-planned paths with desired weld parameters.
        - Tuned weld parameters based on qualitative feedback.
        - Conducted both simulation-based and real-world validation of robotic weld paths.
    - title: Capstone – Jet Impingement Server Cooling
      items:
        - Investigated CPU cooling performance via jet impingement in a custom-built thermal management system.
        - Developed pressure drop models and evaluated experimental vs. theoretical thermal performance.
        - Delivered final technical presentation and undergraduate thesis.
    - title: Reinforcement Learning – Missile Interception
      items:
        - Designed and trained an RL agent using an Advantage Actor-Critic (A2C) framework to intercept variable-trajectory missile targets.
        - Implemented state-dependent reward functions and evaluated robustness across varied initial conditions.
    - title: Feedback Linearization – Missile Trajectory Control
      items:
        - Derived governing equations for missile dynamics in 2D based on fluid/aero-dynamic principles
        - Applied feedback linearization to vary thrust vectoring for trajectory control.
        - Simulated entire system in MATLAB.
    - title: Robotic Manipulator & Path Planning
      items:
        - Developed 3-DOF manipulator motion planning using Dubin’s path constraints.
        - Coupled with a TSP solver for optimal routing through networks of targets.
        - Implemented and validated in MATLAB.
    - title: Mechatronics Course Project – Electro-Mechanical Door Lock
      items:
        - Designed a microcontroller-based access system using photoresistors, keypads, and proximity sensors.
        - Programmed in PICBASIC and Arduino; verified with hardware integration.
